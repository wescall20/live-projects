<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renew Outreach</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172331;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#172331;color:white;padding:16px max(24px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:18px}header div{display:flex;align-items:center;gap:18px;flex-wrap:wrap}header strong{font-size:24px;letter-spacing:.15em;color:#ee5b4e}header span{opacity:.8}main{max-width:1160px;margin:auto;padding:26px 20px 80px}.hero{background:#fff;border-left:6px solid #d84136;padding:30px;margin-bottom:20px}.hero>p:first-child{letter-spacing:.13em;font-size:12px;color:#ac372e;font-weight:700}.hero h1{font-size:clamp(28px,4vw,42px);margin:10px 0}.hero a{color:#0a567d;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #dfe4e8;border-radius:12px;padding:24px;min-width:0;box-shadow:0 8px 20px #17233109}h2{margin-top:0}p{line-height:1.5}label{display:block;margin:17px 0 6px;font-weight:650}input,textarea,select{display:block;width:100%;padding:11px 12px;margin-top:7px;border:1px solid #b8c4cd;border-radius:7px;font:inherit;background:white}button{padding:10px 15px;border:0;border-radius:7px;background:#a52f28;color:white;cursor:pointer;font:inherit;font-weight:650}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#e8eef2;color:#193348}.actions{display:flex;flex-wrap:wrap;gap:9px}.list{display:grid;gap:8px;max-height:280px;overflow:auto;margin:18px 0}.list>button,.lead{padding:11px;text-align:left;background:#f1f4f6;color:#192837;border:1px solid #e0e6eb;border-radius:7px}.list>button.selected{border-color:#b7352d;background:#fff3f1}small{display:block;color:#566575;margin-top:4px}.hint{font-size:13px;color:#526270}.message{padding:12px;background:#e7f0f6;border-radius:7px}.login{max-width:470px;background:white;margin:8vh auto;padding:32px;border-radius:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}header{padding:15px 20px}}
</style></head><body><div id="app"><main>Loading Renew Outreach…</main></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,sendEmailVerification,signInWithEmailAndPassword,signOut,reload} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {getFirestore,collection,addDoc,doc,updateDoc,onSnapshot,serverTimestamp,query,orderBy} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyCvfNXDQOYiiWr4XfoszYaCM8cV1tTUHxc',authDomain:'renew-outreach.firebaseapp.com',projectId:'renew-outreach',appId:'1:801810627803:web:53197465069a6724c1a0fe'});
const auth=getAuth(app),db=getFirestore(app),team=['paulospeople@gmail.com','renewhomeimprovement@proton.me'],counties=['Worcester','Franklin','Hampshire','Hampden','Middlesex','Norfolk','Tolland','Windham','Providence'],target='https://liveprojects.yourbusinessseen.com/renew/#home';
const root=document.getElementById('app');let user=null,campaigns=[],leads=[],active='',message='',error='',stops=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=()=>`${error?`<p role="alert" class="message">${esc(error)}</p>`:''}${message?`<p role="status" class="message">${esc(message)}</p>`:''}`;
async function run(fn){error='';message='';try{await fn()}catch(e){error=e.message||'Action failed'}render()}
function cleanup(){stops.forEach(f=>f());stops=[];campaigns=[];leads=[]}
function listen(){cleanup();stops.push(onSnapshot(query(collection(db,'campaigns'),orderBy('updatedAt','desc')),s=>{campaigns=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{error=e.message;render()}));stops.push(onSnapshot(query(collection(db,'leads'),orderBy('updatedAt','desc')),s=>{leads=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{error=e.message;render()}))}
onAuthStateChanged(auth,u=>{user=u;if(u?.emailVerified&&team.includes(u.email))listen();else cleanup();render()});
function render(){if(!user){root.innerHTML=`<main class="login"><h1>Renew Outreach</h1><p>Private workspace for Wesley and Mark</p>${status()}<form id="login"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required minlength="6" autocomplete="current-password"></label><div class="actions"><button type="submit">Sign in</button><button class="secondary" type="button" id="register">Create team account</button></div></form></main>`;document.getElementById('login').onsubmit=e=>{e.preventDefault();run(()=>signInWithEmailAndPassword(auth,e.target.email.value.trim().toLowerCase(),e.target.password.value))};document.getElementById('register').onclick=()=>run(async()=>{let f=document.getElementById('login'),email=f.email.value.trim().toLowerCase();if(!team.includes(email))throw Error('Use an approved team email.');if(!f.password.value)throw Error('Enter a password.');let r=await createUserWithEmailAndPassword(auth,email,f.password.value);await sendEmailVerification(r.user);message='Check your inbox to verify your email, then sign out and sign in again.'});return}
if(!user.emailVerified||!team.includes(user.email)){root.innerHTML=`<main><h1>${team.includes(user.email)?'Verify your email to continue':'Access restricted'}</h1><p>${team.includes(user.email)?`We created the account for ${esc(user.email)}. Open the Firebase verification email, click its link, then select Refresh verification here. Check spam if you do not see the email.`:'Only the two approved team addresses can access records.'}</p>${status()}<div class="actions">${team.includes(user.email)?'<button id="refresh">Refresh verification</button><button id="resend" class="secondary">Resend verification</button>':''}<button id="logout" class="secondary">Sign out</button></div></main>`;document.getElementById('logout').onclick=()=>signOut(auth);if(team.includes(user.email)){document.getElementById('refresh').onclick=()=>run(async()=>{await reload(user);if(user.emailVerified)listen();else message='Still waiting for verification.'});document.getElementById('resend').onclick=()=>run(async()=>{await sendEmailVerification(user);message='Verification email sent.'})}return}
const mark=user.email===team[1],selected=campaigns.find(c=>c.id===active);root.innerHTML=`<header><div><strong>RENEW</strong><span>Outreach workspace</span></div><div>${esc(user.email)}<button id="logout" class="secondary">Sign out</button></div></header><main><section class="hero"><p>WORCESTER + ADJACENT COUNTIES</p><h1>Make every outreach step clear.</h1><p>Prepare real campaigns, record where leads came from, and direct interest to Renew’s walkthrough app.</p><a href="${target}" target="_blank" rel="noreferrer">Open customer app ↗</a></section>${status()}<div class="grid"><section class="card"><h2>Campaign desk</h2><p>Draft → Mark approval. Email sending will be added after the Postmark backend is configured.</p><button id="new" class="secondary">New draft</button><div class="list">${campaigns.map(c=>`<button type="button" data-campaign="${esc(c.id)}" class="${active===c.id?'selected':''}">${esc(c.subject)}<small>${esc(c.status)}</small></button>`).join('')}</div><label>Subject<input id="subject" maxlength="180" value="${esc(selected?.subject||'')}"></label><label>Email message<textarea id="body" rows="9" maxlength="10000">${esc(selected?.body||'')}</textarea></label><p class="hint">The walkthrough link will be appended when email delivery is configured.</p><div class="actions"><button id="save">Save draft</button>${mark&&selected?.status!=='approved'?'<button id="approve" class="secondary">Approve saved draft</button>':''}</div>${selected?`<p>Status: <strong>${esc(selected.status)}</strong>${selected.approvedBy?` · Approved by ${esc(selected.approvedBy)}`:''}</p>`:''}</section><section class="card"><h2>Lead records</h2><p>Add only real prospects. Track origin and permission; no lead data is generated.</p><form id="lead"><label>Email<input name="email" type="email" required></label><label>Name<input name="name"></label><label>County<select name="county">${counties.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Source<input name="source" required placeholder="Where did this contact come from?"></label><label>Permission<select name="permission"><option value="unknown">Unknown</option><option value="opted-in">Opted in</option><option value="suppressed">Do not contact</option></select></label><label>Notes<textarea name="notes"></textarea></label><button type="submit">Save lead</button></form><h3>Saved leads (${leads.length})</h3><div class="list">${leads.map(l=>`<div class="lead"><strong>${esc(l.name||l.email)}</strong><small>${esc(l.email)} · ${esc(l.county)} · ${esc(l.permission)}</small><small>Source: ${esc(l.source)}</small></div>`).join('')}</div></section></div></main>`;
document.getElementById('logout').onclick=()=>signOut(auth);document.getElementById('new').onclick=()=>{active='';render()};document.querySelectorAll('[data-campaign]').forEach(b=>b.onclick=()=>{active=b.dataset.campaign;render()});document.getElementById('save').onclick=()=>run(async()=>{let subject=document.getElementById('subject').value.trim(),body=document.getElementById('body').value.trim();if(!subject||!body)throw Error('Add a subject and message.');let data={subject,body,status:'draft',lastEditedBy:user.email,updatedAt:serverTimestamp()};if(active)await updateDoc(doc(db,'campaigns',active),data);else active=(await addDoc(collection(db,'campaigns'),data)).id;message='Draft saved. Edits reset approval.'});if(mark&&selected?.status!=='approved')document.getElementById('approve').onclick=()=>run(async()=>{if(document.getElementById('subject').value!==selected.subject||document.getElementById('body').value!==selected.body)throw Error('Save edits before approval.');await updateDoc(doc(db,'campaigns',active),{status:'approved',approvedBy:user.email,approvedAt:serverTimestamp(),lastEditedBy:user.email,updatedAt:serverTimestamp()});message='Campaign approved.'});document.getElementById('lead').onsubmit=e=>{e.preventDefault();run(async()=>{let f=e.target,email=f.email.value.trim().toLowerCase(),source=f.source.value.trim();if(!source)throw Error('Record the real source.');await addDoc(collection(db,'leads'),{email,name:f.name.value.trim(),county:f.county.value,source,permission:f.permission.value,notes:f.notes.value.trim(),updatedAt:serverTimestamp()});message='Lead saved. No message was sent.'})};
}
</script></body></html>
