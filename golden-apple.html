<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Projects | Renew</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #1c1c1c;
    }

    header {
      background: #c9202f;
      color: white;
      text-align: center;
      padding: 42px 20px;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    header h1 {
      margin: 12px 0 5px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 35px 20px;
    }

    .intro {
      text-align: center;
      margin-bottom: 30px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 22px;
    }

    .project {
      background: white;
      border-radius: 18px;
      padding: 32px 22px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.09);
    }

    .icon {
      width: 85px;
      height: 85px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #c9202f;
      color: white;
      font-size: 42px;
    }

    .project h2 {
      margin: 8px 0;
    }

    .project p {
      color: #666;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      margin-top: 12px;
      padding: 13px 24px;
      border-radius: 30px;
      background: #c9202f;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">RENEW</div>
  <h1>Live Projects</h1>
  <p>See what we're building.</p>
</header>

<main>

  <div class="intro">
    <h2>Current Projects</h2>
    <p>Explore our active projects below.</p>
  </div>

  <div class="projects">

    <div class="project">
      <div class="icon">🏠</div>
      <h2>Renew</h2>
      <p>Explore Renew Home Improvement's live project experience.</p>

      <a class="button"
         href="http://Knee-otter-03184327.figma.site">
         Open Project →
      </a>
    </div>

    <div class="project">
      <div class="icon">🍎</div>
      <h2>Golden Apple</h2>
      <p>Discover the Golden Apple homeschool project.</p>

      <a class="button"
         href="#">
         Coming Soon
      </a>
    </div>

  </div>

</main>

<footer>
  © 2026 Renew Home Improvement
</footer>

</body>
</html>
